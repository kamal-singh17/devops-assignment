apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-platform
  namespace: monitoring
  labels:
    # Critical: This label tells the Grafana sidecar to load this dashboard
    grafana_dashboard: "1" 
spec:
  data:
    platform-health.json: |-
      {
        "title": "Platform Health",
        "tags": ["platform", "assignment"],
        "timezone": "browser",
        "panels": [
          {
            "title": "Node CPU Usage (%)",
            "type": "timeseries",
            "gridPos": { "h": 8, "w": 12, "x": 0, "y": 0 },
            "targets": [ { "expr": "100 - (avg by(instance) (rate(node_cpu_seconds_total{mode=\"idle\"}[5m])) * 100)", "refId": "A" } ]
          },
          {
            "title": "Pod Restarts (Last 1h)",
            "type": "table",
            "gridPos": { "h": 8, "w": 12, "x": 12, "y": 0 },
            "targets": [ { "expr": "sum by (namespace, pod) (increase(kube_pod_container_status_restarts_total[1h])) > 0", "format": "table", "instant": true, "refId": "A" } ]
          },
          {
            "title": "API Service Logs (Errors)",
            "type": "logs",
            "gridPos": { "h": 10, "w": 24, "x": 0, "y": 8 },
            "datasource": "Loki",
            "targets": [ { "expr": "{app=\"api\"} |~ \"error|exception\"", "refId": "A" } ]
          }
        ]
      }
